<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sin conexión</title>
  <style>
    body {
      font-family: -apple-system, system-ui, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; margin: 0; padding: 24px; box-sizing: border-box;
      text-align: center; background: #f5f5f7; color: #1d1d1f;
    }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { margin: 0 0 24px; color: #6e6e73; }
    button {
      font-size: 17px; padding: 12px 28px; border: 0; border-radius: 12px;
      background: #007aff; color: #fff;
    }
  </style>
</head>
<body>
  <h1>No se pudo cargar la app</h1>
  <p>Revisa tu conexión a internet e inténtalo de nuevo.</p>
  <button id="reintentar">Reintentar</button>
  <script>
    // La URL de tu web se pone automáticamente al compilar (scripts/preparar-ios.mjs)
    var SERVER_URL = "__SERVER_URL__";
    document.getElementById("reintentar").addEventListener("click", function () {
      window.location.replace(SERVER_URL);
    });
  </script>
</body>
</html>
